<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>La Leyenda de la Virgen del Socavón</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}
body{
overflow:hidden;
background:url("./fon.jpg") no-repeat;
background-size:cover;
background-position:center -230px;
font-family:Arial,sans-serif;
}
h1{
position:absolute;
top:25px;
width:100%;
text-align:center;
color:white;
font-family:'Cinzel',serif;
font-size:60px;
font-weight:900;
letter-spacing:2px;
line-height:.9;
-webkit-text-stroke:1px rgb(59,55,55);
text-shadow:5px 5px 10px rgba(0,0,0,.8);
z-index:10;
}
.btn-inicio{
position:absolute;
top:35px;
right:30px;
z-index:20;
padding:8px 22px;
border:1px solid rgba(255,255,255,.8);
border-radius:30px;
background:rgba(255,255,255,.15);
color:white;
text-decoration:none;
font-family:'Cinzel',serif;
font-size:16px;
font-weight:700;
backdrop-filter:blur(5px);
transition:.3s;
}
.btn-inicio:hover{
background:rgba(255,255,255,.3);
transform:scale(1.05);
}
canvas{
display:block;
}
</style>
</head>
<body>

<h1>LA LEYENDA DE LA VIRGEN DEL SOCAVÓN</h1>

<a href="https://ariananina.github.io/paginavirgen/" class="btn-inicio">Inicio</a>

<script type="importmap">
{
"imports":{
"three":"https://unpkg.com/three/build/three.module.js",
"three/addons/":"https://unpkg.com/three/examples/jsm/"
}
}
</script>

<script type="module">
import*as THREE from"three";
import{GLTFLoader}from"three/addons/loaders/GLTFLoader.js";
import{OrbitControls}from"three/addons/controls/OrbitControls.js";

const scene=new THREE.Scene();

const camera=new THREE.PerspectiveCamera(
45,
innerWidth/innerHeight,
0.1,
100
);

camera.position.set(0,0,6);

const renderer=new THREE.WebGLRenderer({
alpha:true,
antialias:true
});

renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

const luzAmbiente=new THREE.AmbientLight(0xffffff,2);
scene.add(luzAmbiente);

const luz=new THREE.DirectionalLight(0xffffff,3);
luz.position.set(5,5,5);
scene.add(luz);

const controls=new OrbitControls(
camera,
renderer.domElement
);

controls.enableDamping=true;
controls.enableZoom=true;
controls.enableRotate=true;
controls.enablePan=false;

const loader=new GLTFLoader();

loader.load(
"./libro.glb",
function(gltf){

const libro=gltf.scene;

libro.scale.set(5,5,5);
libro.position.set(0,-0.3,0);
libro.rotation.x=-Math.PI/2.6;
libro.rotation.y=Math.PI/2;
libro.rotation.z=Math.PI;

libro.traverse(function(obj){
if(obj.isMesh){
obj.castShadow=true;
obj.receiveShadow=true;
}
});

scene.add(libro);

console.log("Libro cargado correctamente");

},
function(xhr){

if(xhr.total){
console.log(
"Libro: "+
Math.round(xhr.loaded/xhr.total*100)+
"%"
);
}

},
function(error){

console.error(
"Error cargando libro.glb:",
error
);

}
);

function animar(){

requestAnimationFrame(animar);

controls.update();

renderer.render(
scene,
camera
);

}

animar();

window.addEventListener("resize",function(){

const ancho=innerWidth;
const alto=innerHeight;

camera.aspect=ancho/alto;
camera.updateProjectionMatrix();

renderer.setSize(
ancho,
alto
);

});

</script>

</body>
</html>
